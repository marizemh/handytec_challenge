replicaCount: 3

image:
  tag: "stable"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: app.handytec.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: app-tls-prod
      hosts:
        - app.handytec.com
